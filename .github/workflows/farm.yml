name: Tend the farm

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "profile.config.json", ".github/workflows/farm.yml"]

permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grow the crops and rewrite the README
        run: node scripts/build.mjs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          # Optional: add a classic PAT (read:user) as FARM_TOKEN to include private contributions.
          GITHUB_TOKEN: ${{ secrets.FARM_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the harvest
        run: |
          git config user.name "farm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: tend the farm 🌱"
          git push
